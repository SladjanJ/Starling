<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>STARLING admin</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Nunito+Sans:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <main id="admin" class="card">
      <p class="eyebrow">STARLING</p>
      <h1 style="letter-spacing: 0.12em; font-size: 2.4rem">Admin</h1>
      <p class="tagline">Samo ti vidiš ove brojke.</p>
      <form id="form">
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" />
        <button class="btn primary" type="submit" style="width: 100%; margin-top: 12px">Otvori</button>
      </form>
      <p id="err" class="err"></p>
      <div id="stats" class="stats hidden">
        <div class="stat"><b id="s-total">0</b><span>Ukupno posjeta</span></div>
        <div class="stat"><b id="s-unique">0</b><span>Unique</span></div>
        <div class="stat"><b id="s-week">0</b><span>Zadnjih 7 dana</span></div>
        <div class="stat"><b id="s-device">0 / 0</b><span>Mobile / desktop</span></div>
      </div>
    </main>
    <script type="module">
      import { fetchStats } from "./js/analytics.js";

      const form = document.getElementById("form");
      const err = document.getElementById("err");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        err.textContent = "";
        try {
          const data = await fetchStats(document.getElementById("pin").value.trim());
          if (!data || data.ok === false) {
            err.textContent = "Pogrešan PIN.";
            return;
          }
          document.getElementById("stats").classList.remove("hidden");
          document.getElementById("s-total").textContent = data.total;
          document.getElementById("s-unique").textContent = data.unique;
          document.getElementById("s-week").textContent = data.last_7_days;
          document.getElementById("s-device").textContent = `${data.mobile} / ${data.desktop}`;
          sessionStorage.setItem("starling_admin", "1");
        } catch {
          err.textContent = "Nema veze sa bazom. Pokreni supabase/schema.sql.";
        }
      });
    </script>
  </body>
</html>
